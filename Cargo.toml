[package]
name = "stt"
version = "0.1.0"
edition = "2024"
description = "SlimeTT: local Traditional Chinese + English dictation for macOS"
license = "MIT"
readme = "README.md"
autotests = false # tests/*.rs are unit tests, pulled into their modules with #[path]

[dependencies]
anyhow = "1.0.104"
block2 = "0.6.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
bzip2 = "0.6.1"
cpal = "0.18"
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37"
env_logger = "0.11.11"
hound = "3.5.1"
log = "0.4.35"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
opencc-fmmseg = "0.13"
raw-window-handle = "0.6"
resvg = { version = "0.49.0", default-features = false }  # SVG icon only: no text/fonts/raster images
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
toml = "1.1.8"
tray-icon = "0.26"
ureq = { version = "3", features = ["json"] }

[build-dependencies]
bindgen = "0.73.2"
